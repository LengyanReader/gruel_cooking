<nav class="nav" id="nav">
  <div class="nav-brand">
    <a href="/">{{ site_title }}</a>
    {% if locale == 'zh' %}
      <span class="nav-brand-en">活态文化廊道</span>
    {% else %}
      <span class="nav-brand-en">周舟洲粥</span>
    {% endif %}
  </div>
  <div class="nav-right">
    <ul class="nav-links">
      {% for item in nav_items %}
        <li><a href="{{ item.href }}" {% if item.slug == current_slug %}class="active"{% endif %}>{{ item.label }}</a></li>
      {% endfor %}
    </ul>
    <div class="lang-toggle">
      {% for lang in locales %}
        <form method="post" action="/locale/{{ lang }}">
          <button type="submit" {% if locale == lang %}class="active"{% endif %}>{{ '中' if lang == 'zh' else 'EN' }}</button>
        </form>
      {% endfor %}
    </div>
  </div>
</nav>
