<footer class="footer">
  <div class="footer-inner">
    <p class="footer-motto">{{ site_subtitle }}</p>
    <p class="footer-tag">{{ footer_tagline }}</p>
    <p class="footer-links">
      {% for item in nav_items %}{% if not loop.first %} · {% endif %}<a href="{{ item.href }}">{{ item.label }}</a>{% endfor %}
    </p>
    <p class="footer-copy">{{ brand['brand.identity'] }}<br><span class="footer-zhou">{{ brand['brand.zhou_line'] }}</span></p>
  </div>
</footer>
