services:
  living-heritage:
    build: .
    container_name: living-heritage
    ports:
      - "18080:18080"
    environment:
      LH_PORT: "18080"
      # bind all interfaces inside the container so the port mapping forwards
      LH_BIND_HOST: "0.0.0.0"
      # optional admin token; if unset admin routes stay closed (see app/config.py)
      LH_ADMIN_TOKEN: ${LH_ADMIN_TOKEN:-}
      # optional public base URL for absolute OG/SEO links (empty -> relative/suppressed)
      LH_BASE_URL: ${LH_BASE_URL:-}
    volumes:
      # persist the data dir (DB + seeds) across restarts. NOTE: the named
      # volume shadows image seeds on first mount; after a rebuild, refresh:
      #   docker cp ./data/seeds/. living-heritage:/srv/living_heritage/data/seeds/
      #   docker exec living-heritage python -m app.seed
      - lh_data:/srv/living_heritage/data
    restart: unless-stopped

volumes:
  lh_data: